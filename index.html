<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark Core</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Expanding Purple Gradient Circle */
    body::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #a855f7, #6b21a8);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 0;
      pointer-events: none;
    }

    /* Activated / Pulse Transition State */
    body.active::before {
      transform: translate(-50%, -50%) scale(150);
    }

    /* Main Center Card Container */
    #displayContainer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 0.5s ease-in-out;
    }

    /* Clock Display Style (Changes based on active view) */
    #clockDisplay {
      font-weight: 800;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.5s ease;
    }

    #clockDisplay.large {
      font-size: 72px;
      margin-bottom: 10px;
    }

    #clockDisplay.small {
      position: absolute;
      top: 25px;
      font-size: 28px;
      opacity: 0.8;
    }

    /* Weather Container */
    #weatherDisplay {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    #weatherEmoji {
      font-size: 64px;
    }

    #weatherTemp {
      font-size: 36px;
      font-weight: 800;
      color: #38bdf8;
    }

    /* Hourly Forecast Cards Container */
    #hourlyDisplay {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      overflow-x: auto;
      max-width: 90vw;
      padding: 10px;
    }
