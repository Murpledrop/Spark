<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark Core</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Expanding Purple Gradient Circle */
    body::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #a855f7, #6b21a8);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 0;
      pointer-events: none;
    }

    /* Activated State */
    body.active::before {
      transform: translate(-50%, -50%) scale(150);
    }

    #startBtn {
      position: relative;
      z-index: 2;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #2575fc, #6a11cb);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 117, 252, 0.5);
    }

    #status {
      position: relative;
      z-index: 1;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.5px;
      text-align: center;
      padding: 0 20px;
    }

    /* Weather Display Container */
    #weatherDisplay {
      position: relative;
      z-index: 1;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    #weatherEmoji {
      font-size: 64px;
    }

    #weatherTemp {
      font-size: 36px;
      font-weight: 800;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <button id="startBtn">Click to Start Spark</button>
  <div id="status"></div>
  <div id="weatherDisplay">
    <div id="weatherEmoji"></div>
    <div id="weatherTemp"></div>
  </div>

  <script>
    const WAKE_WORD = "spark"; 

    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const weatherEmojiDiv = document.getElementById('weatherEmoji');
    const weatherTempDiv = document.getElementById('weatherTemp');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let audioCtx = null;

    if (!SpeechRecognition) {
      alert("Speech Recognition API not supported in this browser. Try Chrome or Samsung Internet.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      let awaitingCommand = false;

      // Play Chime sound
      function playChime() {
        try {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          // Note 1 (D5)
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          gain1.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc1.connect(gain1);
          gain1.connect(audioCtx.destination);
          osc1.start(audioCtx.currentTime);
          osc1.stop(audioCtx.currentTime + 0.25);

          // Note 2 (A5)
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
          gain2.gain.setValueAtTime(0.15, audioCtx.currentTime + 0.1);
          gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start(audioCtx.currentTime + 0.1);
          osc2.stop(audioCtx.currentTime + 0.35);
        } catch (e) {
          console.log("Audio Context error:", e);
        }
      }

      function speak(text) {
        recognition.stop();
        statusDiv.textContent = text;
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = () => {
          statusDiv.textContent = "";
          recognition.start();
        };
        window.speechSynthesis.speak(utterance);
      }

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim().toLowerCase();

        if (!awaitingCommand && transcript.includes(WAKE_WORD)) {
          playChime();
          document.body.classList.add('active');
          statusDiv.textContent = "Spark is listening...";
          awaitingCommand = true;

          const remainingSpeech = transcript.split(WAKE_WORD)[1].trim();
          if (remainingSpeech.length > 0) {
            handleCommand(remainingSpeech);
          }
        } 
        else if (awaitingCommand) {
          handleCommand(transcript);
        }
      };

      function handleCommand(commandText) {
        awaitingCommand = false;
        document.body.classList.remove('active');
        processCommand(commandText);
      }

      // Convert word numbers to digits
      function wordsToDigits(text) {
        const numberMap = {
          'zero': 0, 'one': 1, 'two': 2, 'three': 3, 'four': 4,
          'five': 5, 'six': 6, 'seven': 7, 'eight': 8, 'nine': 9, 'ten': 10
        };
        
        let result = text;
        for (let word in numberMap) {
          result = result.replace(new RegExp(`\\b${word}\\b`, 'g'), numberMap[word]);
        }
        return result;
      }

      // Math expression evaluator
      function solveMath(expressionText) {
        weatherEmojiDiv.textContent = "";
        weatherTempDiv.textContent = "";

        // Clean up text and convert word numbers
        let cleanText = wordsToDigits(expressionText)
          .replace(/[?.,!]/g, '')
          .replace(/what is|how much is|calculate|solve|equal|equals/gi, '');

        // Replace math phrasing with symbols
        let parsed = cleanText
          .replace(/plus|add/g, '+')
          .replace(/minus|take away/g, '-')
          .replace(/times|multiplied by/g, '*')
          .replace(/divided by|over/g, '/')
          .replace(/x/g, '*')
          .replace(/[^0-9+\-*/.]/g, '');

        try {
          if (!parsed) {
            searchWeb(expressionText);
            return;
          }
          const result = Function(`'use strict'; return (${parsed})`)();
          if (isNaN(result) || result === undefined) {
            searchWeb(expressionText);
            return;
          }
          speak(`The answer is ${result}.`);
        } catch (error) {
          searchWeb(expressionText);
        }
      }

      // Weather Info
      function getWeatherInfo(code) {
        if (code === 0) return { desc: "clear skies", emoji: "☀️" };
        if ([1, 2, 3].includes(code)) return { desc: "partly cloudy", emoji: "⛅" };
        if ([45, 48].includes(code)) return { desc: "foggy", emoji: "🌫️" };
        if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { desc: "rainy", emoji: "🌧️" };
        if ([71, 73, 75, 77, 85, 86].includes(code)) return { desc: "snowy", emoji: "❄️" };
        if ([95, 96, 99].includes(code)) return { desc: "thunderstorms", emoji: "🌩️" };
        return { desc: "fair conditions", emoji: "🌤️" };
      }

      async function fetchWeather() {
        weatherEmojiDiv.textContent = "";
        weatherTempDiv.textContent = "";

        if (!navigator.geolocation) {
          speak("Geolocation is not supported by your browser.");
          return;
        }

        statusDiv.textContent = "Checking weather...";

        navigator.geolocation.getCurrentPosition(async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          try {
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const geoData = await geoRes.json();
            const city = geoData.address.city || geoData.address.town || geoData.address.village || geoData.address.suburb || "your location";

            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            const weatherData = await weatherRes.json();

            const temp = Math.round(weatherData.current_weather.temperature);
            const weatherCode = weatherData.current_weather.weathercode;
            const info = getWeatherInfo(weatherCode);

            weatherEmojiDiv.textContent = info.emoji;
            weatherTempDiv.textContent = `${temp}°C`;

            speak(`It is currently ${temp} degrees Celsius and ${info.desc} in ${city}.`);

          } catch (error) {
            speak("Sorry, I had trouble getting the weather information.");
          }
        }, () => {
          speak("I need location permission to check the weather for your area.");
        });
      }

      async function searchWeb(query) {
        weatherEmojiDiv.textContent = "";
        weatherTempDiv.textContent = "";
        statusDiv.textContent = "Searching online...";

        let cleanQuery = query.replace(/^(who is|what is|tell me about|search for|what are)/i, '').trim();
        if (!cleanQuery) cleanQuery = query;

        try {
          const wikiRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanQuery)}`);
          
          if (wikiRes.ok) {
            const wikiData = await wikiRes.json();
            if (wikiData.extract) {
              const shortAnswer = wikiData.extract.split('. ').slice(0, 2).join('. ') + '.';
              speak(shortAnswer);
              return;
            }
          }

          const ddgRes = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
          const ddgData = await ddgRes.json();

          if (ddgData.AbstractText) {
            speak(ddgData.AbstractText);
          } else if (ddgData.Definition) {
            speak(ddgData.Definition);
          } else {
            speak(`Sorry, I couldn't find an answer for ${cleanQuery}.`);
          }

        } catch (error) {
          speak("Sorry, I had trouble connecting to the web.");
        }
      }

      function processCommand(text) {
        const lower = text.toLowerCase();
        
        // Convert word numbers first to test if the speech contains a math equation
        const convertedText = wordsToDigits(lower);

        // Match if it contains math operators or math keywords
        const isMathCommand = 
          convertedText.includes("plus") || 
          convertedText.includes("minus") || 
          convertedText.includes("times") || 
          convertedText.includes("divided") || 
          convertedText.includes("multiplied") || 
          convertedText.includes("add") || 
          convertedText.includes("calculate") ||
          /[\d]+\s*[\+\-\*\/x]\s*[\d]+/.test(convertedText);

        if (isMathCommand) {
          solveMath(text);
        } else if (lower.includes("weather") || lower.includes("temperature")) {
          fetchWeather();
        } else if (lower.includes("time")) {
          const now = new Date();
          const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          speak(`The current time is ${timeString}.`);
        } else if (lower.includes("date")) {
          const now = new Date();
          const dateString = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
          speak(`Today is ${dateString}.`);
        } else {
          searchWeb(text);
        }
      }

      recognition.onend = () => {
        if (!window.speechSynthesis.speaking) {
          recognition.start();
        }
      };

      startBtn.addEventListener('click', () => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        audioCtx.resume();

        recognition.start();
        startBtn.style.display = 'none';
      });
    }
  </script>
</body>
</html>
