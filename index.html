<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark Core</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Expanding Purple Gradient Circle */
    body::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #a855f7, #6b21a8);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 0;
      pointer-events: none;
    }

    /* Activated / Pulse Transition State */
    body.active::before {
      transform: translate(-50%, -50%) scale(150);
    }

    /* Main Center Card Container */
    #displayContainer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 0.5s ease-in-out;
    }

    /* Clock Display Style */
    #clockDisplay {
      font-weight: 800;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.5s ease;
    }

    #clockDisplay.large {
      font-size: 72px;
      margin-bottom: 10px;
    }

    #clockDisplay.small {
      position: absolute;
      top: 25px;
      font-size: 28px;
      opacity: 0.8;
    }

    /* Space Countdown Display Screen Overlay */
    #spaceCountdownDisplay {
      display: none;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.8), 0 0 40px rgba(168, 85, 247, 0.6);
      margin-top: 10px;
      text-transform: uppercase;
      animation: pulseGlow 1s infinite alternate;
    }

    @keyframes pulseGlow {
      from { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
      to { text-shadow: 0 0 25px rgba(56, 189, 248, 1), 0 0 50px rgba(168, 85, 247, 0.8); }
    }

    /* Weather Container */
    #weatherDisplay {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    #weatherEmoji {
      font-size: 64px;
    }

    #weatherTemp {
      font-size: 36px;
      font-weight: 800;
      color: #38bdf8;
    }

    /* Hourly Forecast Cards Container */
    #hourlyDisplay {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      overflow-x: auto;
      max-width: 90vw;
      padding: 10px;
    }

    .hourly-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 75px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .hourly-time {
      font-size: 14px;
      opacity: 0.8;
      font-weight: 600;
    }

    .hourly-emoji {
      font-size: 28px;
      margin: 6px 0;
    }

    .hourly-temp {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }

    #startBtn {
      position: relative;
      z-index: 2;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #2575fc, #6a11cb);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 20px;
    }

    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 117, 252, 0.5);
    }

    #status {
      position: relative;
      z-index: 1;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      margin-top: 15px;
      text-align: center;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <div id="clockDisplay" class="large">--:--</div>

  <div id="displayContainer">
    <div id="spaceCountdownDisplay">T-MINUS 10</div>
    <div id="weatherDisplay">
      <div id="weatherEmoji"></div>
      <div id="weatherTemp"></div>
    </div>
    <div id="hourlyDisplay"></div>
  </div>

  <button id="startBtn">Click to Start Spark</button>
  <div id="status"></div>

  <script>
    const WAKE_WORD = "spark"; 

    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const weatherEmojiDiv = document.getElementById('weatherEmoji');
    const weatherTempDiv = document.getElementById('weatherTemp');
    const hourlyDisplay = document.getElementById('hourlyDisplay');
    const clockDisplay = document.getElementById('clockDisplay');
    const spaceCountdownDisplay = document.getElementById('spaceCountdownDisplay');
    const weatherDisplay = document.getElementById('weatherDisplay');

    let currentViewMode = 0; // 0 = Clock View, 1 = Hourly Forecast View
    let activeTimer = null;
    let activeAlarm = null;
    let countdownInterval = null;

    // Clock Functionality (Hours and Minutes only)
    function updateClock() {
      const now = new Date();
      clockDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      checkAlarm(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Trigger Pulse Expansion Animation
    function triggerPulseAnimation() {
      document.body.classList.add('active');
      setTimeout(() => {
        if (!awaitingCommand) {
          document.body.classList.remove('active');
        }
      }, 700);
    }

    // Display Mode Cycling (Hidden if space countdown active)
    function cycleDisplayMode() {
      if (countdownInterval) return; // Don't cycle views during final 10s countdown

      triggerPulseAnimation();
      
      if (currentViewMode === 0) {
        clockDisplay.className = "small";
        weatherDisplay.style.display = "none";
        hourlyDisplay.style.display = "flex";
        currentViewMode = 1;
      } else {
        clockDisplay.className = "large";
        weatherDisplay.style.display = "flex";
        hourlyDisplay.style.display = "none";
        currentViewMode = 0;
      }
    }

    setInterval(cycleDisplayMode, 8000);

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let audioCtx = null;
    let awaitingCommand = false;

    // Futuristic Space Sound Generator
    function playSpaceChime() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const notes = [440, 554.37, 659.25, 880]; // Sci-Fi synth chime sequence
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.12));

          gain.gain.setValueAtTime(0, audioCtx.currentTime + (idx * 0.12));
          gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + (idx * 0.12) + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.12) + 0.8);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + (idx * 0.12));
          osc.stop(audioCtx.currentTime + (idx * 0.12) + 0.8);
        });
      } catch (e) {
        console.log("Space Chime Audio Error:", e);
      }
    }

    function playWakeChime() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain1.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(audioCtx.currentTime);
        osc1.stop(audioCtx.currentTime + 0.25);
      } catch (e) {
        console.log("Audio Context error:", e);
      }
    }

    if (!SpeechRecognition) {
      alert("Speech Recognition API not supported in this browser. Try Chrome or Samsung Internet.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      function speak(text, callback) {
        recognition.stop();
        statusDiv.textContent = text;
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = () => {
          statusDiv.textContent = "";
          if (callback) callback();
          recognition.start();
        };
        window.speechSynthesis.speak(utterance);
      }

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim().toLowerCase();

        if (!awaitingCommand && transcript.includes(WAKE_WORD)) {
          playWakeChime();
          document.body.classList.add('active');
          statusDiv.textContent = "Spark is listening...";
          awaitingCommand = true;

          const remainingSpeech = transcript.split(WAKE_WORD)[1].trim();
          if (remainingSpeech
